[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "choravox"
version = "0.1.1"
description = "Offline synthetic multi-speaker meeting speech toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Zhang San", email = "227249797+FirmwareVersion@users.noreply.github.com" },
]
dependencies = ["numpy==2.3.3"]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.17.0",
]
torch = ["torch==2.8.0"]

[project.scripts]
choravox = "choravox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/choravox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: comparatively expensive synthetic training or integration test",
  "model: test requiring the optional CPU PyTorch extra",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["choravox"]
